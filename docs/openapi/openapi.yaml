openapi: 3.1.0
info:
  title: Cybertech E-Commerce API
  description: |
    Backend REST API for the Cybertech e-commerce platform.

    Covers the full e-commerce lifecycle: product catalog, search,
    cart, wishlist, orders, payments (Stripe), reviews and moderation,
    bank cards (PCI-aware), discount campaigns, user management
    (Keycloak-backed) and behavioural event ingestion.

    Authentication is performed via Keycloak-issued JWT bearer tokens.
    Public endpoints (catalog browsing, registration, Stripe webhook)
    are explicitly whitelisted; every other endpoint requires a
    valid Bearer token and may further restrict to USER or ADMIN roles.
  contact:
    name: Cybertech Team
    email: dev@cybertech.local
  license:
    name: Proprietary
    url: https://cybertech.local/license
  version: "1.0"
servers:
- url: http://localhost:8081
  description: Local dev
- url: https://api.cybertech.local
  description: Production
security:
- keycloak: []
tags:
- name: User Admin
  description: Admin-only endpoints for user CRUD
- name: Discount Admin
  description: Admin discount/campaign management endpoints
- name: Product
  description: "Public catalog endpoints: read products, search and best-sellers"
- name: Wishlist
  description: Endpoints to manage the authenticated user's wishlist
- name: Product Category Schema Admin
  description: Admin management of product category JSON Schemas
- name: User
  description: "User self-service: signup, read a profile by UUID and update one's\
    \ own profile"
- name: Review
  description: Endpoints for product review CRUD operations
- name: Order Admin
  description: Admin-only endpoints for paginated order listing with optional status
    / user filters
- name: Order
  description: "Endpoints for placing, retrying, retrieving, updating, cancelling\
    \ and deleting orders"
- name: Bank Card Admin
  description: "Admin-only endpoints to list, read and delete any user's bank card"
- name: Bank Card
  description: Endpoints to manage the authenticated user's bank card
- name: Product Category Schema
  description: Public read access to product category JSON Schemas
- name: Cart
  description: Endpoints to manage the authenticated user's shopping cart
- name: User Events
  description: Ingestion of user interaction events
- name: Stripe Webhook
  description: "Stripe webhook ingestion endpoint (publicly reachable, secured via\
    \ HMAC-SHA256 Stripe-Signature header)"
- name: Product Admin
  description: Admin-only endpoints for product CRUD and image upload
- name: Recommendations
  description: Endpoints to read the connected user's personalized product recommendations
- name: Shipping
  description: Public shipping options and fees
- name: Push notifications
  description: Browser push subscription management
- name: Discount
  description: Public discount/campaign read endpoints
paths:
  /api/v1/services/bank-card/update:
    put:
      tags:
      - Bank Card
      summary: Update current user's bank card
      description: Updates the bank card details for the authenticated user.
      operationId: updateBankCard
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankCardUpdateRequestDto"
        required: true
      responses:
        "200":
          description: Bank card updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankCardResponseDto"
        "404":
          description: Bank card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/bank-card/replace:
    put:
      tags:
      - Bank Card
      summary: Replace current user's bank card
      description: |
        Replaces the authenticated user's bank card with a new one (same body as /add), or adds it
        when the user has none. Delete and add run in a single transaction: the new card is
        validated first and any failure keeps the current card, so the account is never left
        without one.
      operationId: replaceBankCard
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankCardCreationRequestDto"
        required: true
      responses:
        "200":
          description: Bank card replaced (or added)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankCardResponseDto"
        "400":
          description: Invalid input or expired card (BANK_CARD_EXPIRED); the current
            card is kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/webhooks/stripe:
    post:
      tags:
      - Stripe Webhook
      summary: Stripe Webhook endpoint
      description: Receives Stripe webhook events for payments and refunds. Returns
        200 on accepted/non-retriable; 400 on invalid signature or malformed payload.
      operationId: handleStripeEvent
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Webhook accepted (or non-retriable downstream failure ACKed
            to stop Stripe retries)
        "400":
          description: Invalid Stripe signature or malformed event payload
  /api/v1/services/wishlist/add/{productUuid}:
    post:
      tags:
      - Wishlist
      summary: Add product to my wishlist
      description: Adds a specific product to the connected user's wishlist.
      operationId: addProductToWishlist
      parameters:
      - name: productUuid
        in: path
        description: UUID of the product to add
        required: true
        schema:
          type: string
          format: uuid
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      responses:
        "201":
          description: Product added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponseDto"
        "401":
          description: Unauthorized - User not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: Conflict - Product already in wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/user/register:
    post:
      tags:
      - User
      summary: Public signup
      description: |
        Anonymous endpoint (whitelisted in SecurityConfig#PUBLIC_URLS). Creates the Keycloak
        account and the local user in one saga; the optional nested bank card is stored
        encrypted. The response only carries id, email and username — the Keycloak id is
        deliberately not exposed to an anonymous caller.
      operationId: register
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Signup payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequestDto"
        required: true
      responses:
        "201":
          description: "User created — body: {id, email, username}"
          content:
            application/json: {}
        "400":
          description: Invalid input data / Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: A user with this email / username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  /api/v1/services/review/create:
    post:
      tags:
      - Review
      summary: Create a new Review
      description: Registers a new Review in the system. Requires authenticated USER
        role.
      operationId: createReview
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Review data for creation. All fields are mandatory
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreateRequestDto"
        required: true
      responses:
        "201":
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponseDto"
        "400":
          description: Invalid input data / Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: "Forbidden - caller does not own the order being reviewed, or COMMENT_POST_NOT_ALLOWED when moderation judged the comment hateful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Product / Order / User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error during Review creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "503":
          description: "MODERATION_UNAVAILABLE - the comment moderation service gave no verdict (down, timeout, non-2xx); nothing is saved, retry later without changing the text"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/product/search:
    post:
      tags:
      - Product
      summary: Search products
      description: "Searches products using filters such as name, category, brand, price range, attributes, etc. The optional sort (RELEVANCE, NAME_ASC, PRICE_ASC, PRICE_DESC, RATING_DESC) orders the whole result before pagination; an unknown value is a 400 MALFORMED_JSON."
      operationId: searchProducts
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Search criteria for filtering products
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequestDto"
        required: true
      responses:
        "200":
          description: List of products matching the search criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Invalid search criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  /api/v1/services/product/search/facets:
    post:
      tags:
      - Product
      summary: "Catalog facets: filter values and their product counts (public)"
      description: |
        Takes the same body as /search (`page` and `size` are ignored) and returns, in one call, the
        values actually present among the matching products with their counts: brands, price bounds
        and, when `category` is given, the values of each text attribute and the bounds of each
        integer / number attribute of that category's JSON Schema (keys come from the schema).

        Disjunctive counting: each facet is counted under every active filter except its own, so
        ticking a brand keeps the other brands listed with their counts while the attribute counts
        narrow to that brand. Keyword and category always apply. `totalHits` matches every filter,
        like /search's `page.totalElements`. Values are sorted by count descending then
        alphabetically, capped at 50 per facet; blank values are skipped. As on /search,
        `attributes` and `numericRanges` are ignored when `category` is absent.

        Public endpoint, no JWT required. Sent with a short `Cache-Control: public`.
      operationId: getSearchFacets
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: "Search criteria, as for /search"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequestDto"
        required: true
      responses:
        "200":
          description: Facets of the matching products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFacetsResponseDto"
        "400":
          description: Invalid criteria (INVALID_REQUEST) or category without a schema
            (UNKNOWN_PRODUCT_CATEGORY)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  /api/v1/services/notifications/push/subscriptions:
    post:
      tags:
      - Push notifications
      summary: Register or update this browser's push subscription
      description: "The authenticated JWT subject owns the subscription; any user\
        \ identifier in the body is ignored/not accepted. A user keeps at most 5 browsers\
        \ (cybertech.web-push.max-subscriptions-per-user): registering one more replaces\
        \ the oldest."
      operationId: register_1
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequestDto"
        required: true
      responses:
        "201":
          description: Subscription registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionResponseDto"
  /api/v1/services/management/order/update:
    post:
      tags:
      - Order
      summary: Update an existing Order by UUID
      description: |
        Updates an existing order's details based on their unique UUID. Fields not provided will not be updated.
      operationId: updateOrder
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Order data for update. Only provide fields that need to be changed.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateRequestDto"
        required: true
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid input data / Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Operation forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: "Not enough stock (NOT_ENOUGH_STOCK): details.items lists the\
            \ product lines in shortage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
              examples:
                NOT_ENOUGH_STOCK:
                  description: NOT_ENOUGH_STOCK
                  value:
                    message: "Not enough stock for product 0199c6a1-3f2b-7c4e-9d10-5b8a2e4f6c01:\
                      \ requested=3, available=1"
                    httpStatusCode: 409
                    errorCodeType: FUNCTIONAL
                    errorCode: NOT_ENOUGH_STOCK
                    details:
                      items:
                      - productUuid: 0199c6a1-3f2b-7c4e-9d10-5b8a2e4f6c01
                        requested: 3
                        available: 1
        "500":
          description: Internal server error during order update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/management/order/retry-payment/{uuid}:
    post:
      tags:
      - Order
      summary: Retry payment for a failed order
      description: "Retries the payment process for an order that is in PAYMENT_FAILED status. Checks stock availability before proceeding. The order is persisted as AWAITING_PAYMENT until the payment webhook settles it (PAID or PAYMENT_FAILED); a late failure of an earlier attempt no longer overwrites it."
      operationId: retryPayment
      parameters:
      - name: uuid
        in: path
        description: The UUID of the order to retry payment for
        required: true
        schema:
          type: string
          format: uuid
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
          - 1.0.0
      responses:
        "200":
          description: "Payment retried: the order is AWAITING_PAYMENT until the payment webhook settles it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid request or Order not in FAILED state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: "Not enough stock (NOT_ENOUGH_STOCK): details.items lists the\
            \ product lines in shortage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
              examples:
                NOT_ENOUGH_STOCK:
                  description: NOT_ENOUGH_STOCK
                  value:
                    message: "Not enough stock for product 0199c6a1-3f2b-7c4e-9d10-5b8a2e4f6c01:\
                      \ requested=3, available=1"
                    httpStatusCode: 409
                    errorCodeType: FUNCTIONAL
                    errorCode: NOT_ENOUGH_STOCK
                    details:
                      items:
                      - productUuid: 0199c6a1-3f2b-7c4e-9d10-5b8a2e4f6c01
                        requested: 3
                        available: 1
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/management/order/quote:
    post:
      tags:
      - Order
      summary: Quote the order the caller's cart would make (authenticated users only)
      description: |
        Prices the caller's server-side cart (lines and current product prices come from
        the cart, never from the body) with the given shipping options and campaign,
        exactly like placing the order would: `totalAmount` equals the total of the order
        placed right after with the same options. No side effect: no order, no stock
        reservation, no payment. `discountApplied` is false when there is no campaign or
        when the subtotal is below the campaign's `minOrderAmount`.
        Same rate limit as the cart endpoints.
      operationId: quote
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Shipping options and campaign (discountKey defaults to NO_DISCOUNT).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderQuoteRequestDto"
        required: true
      responses:
        "200":
          description: Quote computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderQuoteResponseDto"
        "400":
          description: "Validation error, or unknown / inactive campaign (DISCOUNT_TYPE_NOT_ACTIVE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: The cart is empty (CART_IS_EMPTY)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "429":
          description: "Too many requests (TOO_MANY_REQUESTS), see Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/management/order/place:
    post:
      tags:
      - Order
      summary: Place a new order (authenticated users only)
      description: |
        Creates a new order for the authenticated user.
        The request must include the list of products to purchase, quantities,
        shipping address, and payment type.
        Requires a valid JWT token in the Authorization header (Bearer token).
      operationId: placeOrder
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Order creation data for the currently authenticated user.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPlacingRequestDto"
        required: true
      responses:
        "201":
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - user not allowed to perform this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: "Not enough stock (NOT_ENOUGH_STOCK): details.items lists the\
            \ product lines in shortage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
              examples:
                NOT_ENOUGH_STOCK:
                  description: NOT_ENOUGH_STOCK
                  value:
                    message: "Not enough stock for product 0199c6a1-3f2b-7c4e-9d10-5b8a2e4f6c01:\
                      \ requested=3, available=1"
                    httpStatusCode: 409
                    errorCodeType: FUNCTIONAL
                    errorCode: NOT_ENOUGH_STOCK
                    details:
                      items:
                      - productUuid: 0199c6a1-3f2b-7c4e-9d10-5b8a2e4f6c01
                        requested: 3
                        available: 1
        "500":
          description: Internal server error while placing the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/management/order/cancel:
    post:
      tags:
      - Order
      summary: Cancel an existing order (authenticated users only)
      description: |
        Cancels an order identified by its UUID.
        The operation is allowed only if the order belongs to the authenticated user and is in a cancellable state.
        Requires a valid JWT token in the Authorization header (Bearer token).
      operationId: cancelOrder
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancellationRequestDto"
        required: true
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid order UUID or order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - user not allowed to cancel this order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Order not found
