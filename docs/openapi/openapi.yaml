    DiscountContext:
      type: object
      properties:
        discountKey:
          type: string
        calculationType:
          type: string
          enum:
          - NONE
          - PERCENTAGE
          - FIXED_AMOUNT
          - BUY_ONE_GET_ONE_FREE
        percentage:
          type: number
        fixedAmount:
          type: number
        minOrderAmount:
          type: number
        maxDiscountAmount:
          type: number
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    CartItemRemoveRequestDto:
      type: object
      properties:
        productUuid:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
      - productUuid
      - quantity
  securitySchemes:
    keycloak:
      type: http
      description: "Keycloak-issued JWT access token. Obtain one from the realm token\
        \ endpoint and pass it as the Authorization header: 'Bearer <token>'."
      scheme: bearer
      bearerFormat: JWT
