# Generated by springdoc from the *ApiSpec interfaces (com.novatech.cybertech.api.controllers.spec)
# — do not edit by hand: change the annotations, then regenerate.
# Regenerate: boot the app, then `curl http://localhost:8081/v3/api-docs.yaml -o docs/openapi/openapi.yaml`
# (or `./mvnw -Dskip=false springdoc-openapi:generate`) and keep this header.
openapi: 3.1.0
info:
  title: Cybertech E-Commerce API
  description: |
    Backend REST API for the Cybertech e-commerce platform.

    Covers the full e-commerce lifecycle: product catalog, search,
    cart, wishlist, orders, payments (Stripe), reviews and moderation,
    bank cards (PCI-aware), discount campaigns, user management
    (Keycloak-backed) and behavioural event ingestion.

    Authentication is performed via Keycloak-issued JWT bearer tokens.
    Public endpoints (catalog browsing, registration, Stripe webhook)
    are explicitly whitelisted; every other endpoint requires a
    valid Bearer token and may further restrict to USER or ADMIN roles.
  contact:
    name: Cybertech Team
    email: dev@cybertech.local
  license:
    name: Proprietary
    url: https://cybertech.local/license
  version: "1.0"
servers:
- url: http://localhost:8081
  description: Local dev
- url: https://api.cybertech.local
  description: Production
security:
- keycloak: []
tags:
- name: User Admin
  description: Admin-only endpoints for user CRUD
- name: Discount Admin
  description: Admin discount/campaign management endpoints
- name: Product
  description: "Public catalog endpoints: read products, search and best-sellers"
- name: Wishlist
  description: Endpoints to manage the authenticated user's wishlist
- name: Product Category Schema Admin
  description: Admin management of product category JSON Schemas
- name: User
  description: "User self-service: signup, read a profile by UUID and update one's\
    \ own profile"
- name: Review
  description: Endpoints for product review CRUD operations
- name: Order Admin
  description: Admin-only endpoints for paginated order listing with optional status
    / user filters
- name: Order
  description: "Endpoints for placing, retrying, retrieving, updating, cancelling\
    \ and deleting orders"
- name: Bank Card Admin
  description: "Admin-only endpoints to list, read and delete any user's bank card"
- name: Bank Card
  description: Endpoints to manage the authenticated user's bank card
- name: Product Category Schema
  description: Public read access to product category JSON Schemas
- name: Cart
  description: Endpoints to manage the authenticated user's shopping cart
- name: User Events
  description: Ingestion of user interaction events
- name: Stripe Webhook
  description: "Stripe webhook ingestion endpoint (publicly reachable, secured via\
    \ HMAC-SHA256 Stripe-Signature header)"
- name: Product Admin
  description: Admin-only endpoints for product CRUD and image upload
- name: Recommendations
  description: Endpoints to read the connected user's personalized product recommendations
- name: Discount
  description: Public discount/campaign read endpoints
paths:
  /api/v1/services/bank-card/update:
    put:
      tags:
      - Bank Card
      summary: Update current user's bank card
      description: Updates the bank card details for the authenticated user.
      operationId: updateBankCard
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankCardUpdateRequestDto"
        required: true
      responses:
        "200":
          description: Bank card updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankCardResponseDto"
        "404":
          description: Bank card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/webhooks/stripe:
    post:
      tags:
      - Stripe Webhook
      summary: Stripe Webhook endpoint
      description: Receives Stripe webhook events for payments and refunds. Returns
        200 on accepted/non-retriable; 400 on invalid signature or malformed payload.
      operationId: handleStripeEvent
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Webhook accepted (or non-retriable downstream failure ACKed
            to stop Stripe retries)
        "400":
          description: Invalid Stripe signature or malformed event payload
  /api/v1/services/wishlist/add/{productUuid}:
    post:
      tags:
      - Wishlist
      summary: Add product to my wishlist
      description: Adds a specific product to the connected user's wishlist.
      operationId: addProductToWishlist
      parameters:
      - name: productUuid
        in: path
        description: UUID of the product to add
        required: true
        schema:
          type: string
          format: uuid
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      responses:
        "201":
          description: Product added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponseDto"
        "401":
          description: Unauthorized - User not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: Conflict - Product already in wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/user/register:
    post:
      tags:
      - User
      summary: Public signup
      description: |
        Anonymous endpoint (whitelisted in SecurityConfig#PUBLIC_URLS). Creates the Keycloak
        account and the local user in one saga; the optional nested bank card is stored
        encrypted. The response only carries id, email and username — the Keycloak id is
        deliberately not exposed to an anonymous caller.
      operationId: register
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Signup payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequestDto"
        required: true
      responses:
        "201":
          description: "User created — body: {id, email, username}"
          content:
            application/json: {}
        "400":
          description: Invalid input data / Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: A user with this email / username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  /api/v1/services/review/create:
    post:
      tags:
      - Review
      summary: Create a new Review
      description: Registers a new Review in the system. Requires authenticated USER
        role.
      operationId: createReview
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Review data for creation. All fields are mandatory
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreateRequestDto"
        required: true
      responses:
        "201":
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponseDto"
        "400":
          description: Invalid input data / Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - caller does not own the order being reviewed or
            comment moderation rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Product / Order / User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error during Review creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/product/search:
    post:
      tags:
      - Product
      summary: Search products
      description: "Searches products using filters such as name, category, brand,\
        \ price range, attributes, etc."
      operationId: searchProducts
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Search criteria for filtering products
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequestDto"
        required: true
      responses:
        "200":
          description: List of products matching the search criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Invalid search criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  /api/v1/services/management/order/update:
    post:
      tags:
      - Order
      summary: Update an existing Order by UUID
      description: |
        Updates an existing order's details based on their unique UUID. Fields not provided will not be updated.
      operationId: updateOrder
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Order data for update. Only provide fields that need to be changed.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateRequestDto"
        required: true
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid input data / Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Operation forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error during order update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/management/order/retry-payment/{uuid}:
    post:
      tags:
      - Order
      summary: Retry payment for a failed order
      description: Retries the payment process for an order that is in PAYMENT_FAILED
        status. Checks stock availability before proceeding.
      operationId: retryPayment
      parameters:
      - name: uuid
        in: path
        description: The UUID of the order to retry payment for
        required: true
        schema:
          type: string
          format: uuid
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
          - 1.0.0
      responses:
        "200":
          description: Payment retried successfully (Order Paid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid request or Order not in FAILED state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/management/order/place:
    post:
      tags:
      - Order
      summary: Place a new order (authenticated users only)
      description: |
        Creates a new order for the authenticated user.
        The request must include the list of products to purchase, quantities,
        shipping address, and payment type.
        Requires a valid JWT token in the Authorization header (Bearer token).
      operationId: placeOrder
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Order creation data for the currently authenticated user.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPlacingRequestDto"
        required: true
      responses:
        "201":
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - user not allowed to perform this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error while placing the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/management/order/cancel:
    post:
      tags:
      - Order
      summary: Cancel an existing order (authenticated users only)
      description: |
        Cancels an order identified by its UUID.
        The operation is allowed only if the order belongs to the authenticated user and is in a cancellable state.
        Requires a valid JWT token in the Authorization header (Bearer token).
      operationId: cancelOrder
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancellationRequestDto"
        required: true
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        "400":
          description: Invalid order UUID or order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - user not allowed to cancel this order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error while cancelling the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/cart/add:
    post:
      tags:
      - Cart
      summary: Add items to cart
      description: Adds items to the authenticated user's cart.
      operationId: addToCart
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Details of items to add
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartCreateRequestDto"
        required: true
      responses:
        "201":
          description: Items added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponseDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Operation forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: User or Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  /api/v1/services/bank-card/add:
    post:
      tags:
      - Bank Card
      summary: Add a bank card to current user
      description: Adds a new bank card for the authenticated user. User can only
        have one card.
      operationId: addBankCard
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankCardCreationRequestDto"
        required: true
      responses:
        "201":
          description: Bank card added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankCardResponseDto"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: User already has a bank card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/admin/user/register/auto/single:
    post:
      tags:
      - User Admin
      summary: Register an auto-generated synthetic user (Admin debug helper)
      description: Admin-only developer / load-test utility that mints a synthetic
        user (Keycloak + DB) from random data via the data generator. Returns a compact
        map including the generated keycloakId (which UserResponseDto @JsonIgnores)
        so the admin caller can identify the synthetic user.
      operationId: registerAuto
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      responses:
        "201":
          description: "Synthetic user created; body = { id, keycloakId, email, username\
            \ }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Operation forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/admin/user/create:
    post:
      tags:
      - User Admin
      summary: Create a new User (Admin)
      description: Registers a new user in the system via Admin console.
      operationId: createUser
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: User data for creation.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequestDto"
        required: true
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDto"
        "400":
          description: Invalid input data / Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Operation forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "409":
          description: Conflict - User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/admin/product-category-schemas/create:
    post:
      tags:
      - Product Category Schema Admin
      summary: Register a new product category (Admin)
      description: |
        Registers a brand-new product category: a `categoryKey`, a display `label`, and
        a JSON Schema describing/validating the shape of that category's `attributes`
        payload. The schema is compiled before saving — a malformed schema is rejected
        with 400 and nothing is persisted. Once saved, `ProductValidationService`
        validates every product create/update against it immediately — no redeploy.
      operationId: create
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCategorySchemaCreateRequestDto"
        required: true
      responses:
        "201":
          description: Schema registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategorySchemaResponseDto"
        "400":
          description: Invalid input / malformed JSON Schema / categoryKey already
            registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
  /api/v1/services/admin/management/product/create:
    post:
      tags:
      - Product Admin
      summary: Create a new Product (Admin)
      description: Registers a new Product in the system.
      operationId: createProduct
      parameters:
      - name: X-API-VERSION
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        description: Product data for creation. All fields are mandatory
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequestDto"
        required: true
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Invalid input data / Validation error / product attributes
            not matching category constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized - JWT token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Operation forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error during Product creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
      - keycloak: []
