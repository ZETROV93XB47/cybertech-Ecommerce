# Generated by springdoc from the *ApiSpec interfaces (com.novatech.cybertech.api.controllers.spec)
# — do not edit by hand: change the annotations, then regenerate.
# Regenerate: boot the app, then `curl http://localhost:8081/v3/api-docs.yaml -o docs/openapi/openapi.yaml`
