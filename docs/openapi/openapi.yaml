components:
  schemas:
    BankCardUpdateRequestDto:
      type: object
      properties:
        cardHolderName:
          type: string
          minLength: 1
        expiryDate:
          type: string
          minLength: 1
          pattern: "(0[1-9]|1[0-2])/[0-9]{4}"
      required:
      - cardHolderName
      - expiryDate
    BankCardResponseDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        cardHolderName:
          type: string
        maskedNumber:
          type: string
        expiryDate:
          type: string
        cardType:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMERICAN_EXPRESS
          - DISCOVER
          - OTHER
        userUuid:
          type: string
          format: uuid
    StockShortageDto:
      type: object
      description: A product line whose quantity exceeds the available stock
      properties:
        productUuid:
          type: string
          format: uuid
          description: UUID of the product in shortage
          example: 0199c6a1-3f2b-7c4e-9d10-5b8a2e4f6c01
        requested:
          type: integer
          format: int32
          description: Quantity asked for this product by the request
          example: 3
        available:
          type: integer
          format: int32
          description: "Quantity that can still be ordered (stock - reserved stock,\
            \ never negative)"
          example: 1
          minimum: 0
    ErrorDetailsDto:
      type: object
      description: Structured error payload. Present only for errors that document
        it (NOT_ENOUGH_STOCK).
      properties:
        items:
          type: array
          description: Every product line in shortage (a cart write reports the first
            one only)
          items:
            $ref: "#/components/schemas/StockShortageDto"
            description: Every product line in shortage (a cart write reports the
              first one only)
    ErrorResponseDto:
      type: object
      properties:
        message:
          type: string
        httpStatusCode:
          type: integer
          format: int32
        errorCodeType:
          type: string
          enum:
          - TECHNICAL
          - FUNCTIONAL
        errorCode:
          type: string
          enum:
          - APPLICATION_ERROR
          - AUTHENTICATION_REQUIRED
          - TOO_MANY_REQUESTS
          - RESOURCE_NOT_FOUND
          - ACCOUNT_NOT_FOUND
          - CANNOT_CANCEL_ORDER
          - CANNOT_REMOVE_ITEM_FROM_EMPTY_CART
          - PRODUCT_NOT_FOUND
          - ORDER_DOESNT_BELONGS_TO_USER
          - FAILED_UPDATING_ORDER
          - CART_IS_EMPTY
          - CART_NOT_FOUND
          - CART_ITEM_NOT_FOUND
          - INVALID_REQUEST
          - MALFORMED_JSON
          - METHOD_ARGUMENT_TYPE_MISMATCH
          - ACCESS_DENIED
          - ORDER_ALREADY_SHIPPED
          - ORDER_NOT_FOUND
          - ORDER_NOT_FUNDED
          - ORDER_REFUND_FAILED
          - NO_PREVIOUS_PAYMENT_ATTEMPT_FOUND
          - PRODUCT_ALREADY_IN_WISHLIST
          - REVIEW_NOT_FOUND
          - USER_NOT_FOUND
          - USER_NOT_ACTIVE
          - USER_ALREADY_EXISTS
          - USER_NOT_AUTHOR_OF_REVIEW
          - WISHLIST_NOT_FOUND
          - ACCESS_TOKEN_RETRIEVAL_FAILED
          - BANK_CARD_ALREADY_EXISTS
          - BANK_CARD_EXPIRED
          - BANK_CARD_NOT_FOUND
          - COMMENT_POST_NOT_ALLOWED
          - MODERATION_UNAVAILABLE
          - IDEMPOTENCY_KEY_GENERATION_FAILED
          - NO_STRATEGY_FOUND
          - NOT_ENOUGH_STOCK
          - ORDER_SUMMARY_REPORT_JOB_FAILED
          - CONCURRENT_MODIFICATION
          - PAYMENT_ALREADY_COMPLETED
          - PAYMENT_FAILED
          - PAYMENT_NOT_FOUND
          - PAYMENT_PROCESSING_ERROR
          - DISCOUNT_TYPE_NOT_ACTIVE
          - UNAUTHORIZED_CART_ACCESS
          - ORDER_NOT_REVIEWABLE
          - UNKNOWN_PRODUCT_CATEGORY
          - INVALID_PRODUCT_CATEGORY_SCHEMA
          - DISCOUNT_CAMPAIGN_MISSING_REQUIRED_FIELD
          - DISCOUNT_CAMPAIGN_NOT_FOUND
          - DISCOUNT_CAMPAIGN_ALREADY_EXISTS
          - PUSH_SERVICE_NOT_CONFIGURED
          - PUSH_SUBSCRIPTION_CONFLICT
          - INVALID_PUSH_ENDPOINT
          - PUSH_SUBSCRIPTION_NOT_FOUND
          - PUSH_SUBSCRIPTION_NOT_OWNED
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldErrorDto"
        details:
          $ref: "#/components/schemas/ErrorDetailsDto"
    FieldErrorDto:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    BankCardCreationRequestDto:
      type: object
      properties:
        cardHolderName:
          type: string
          minLength: 1
        cardNumber:
          type: string
          maxLength: 19
          minLength: 13
          pattern: "\\d{13,19}"
        expiryDate:
          type: string
          minLength: 1
          pattern: "(0[1-9]|1[0-2])/[0-9]{4}"
        cardType:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMERICAN_EXPRESS
          - DISCOVER
          - OTHER
      required:
      - cardHolderName
      - cardNumber
      - cardType
      - expiryDate
    ProductResponseDto:
      type: object
      properties:
        name:
          type: string
        uuid:
          type: string
        price:
          type: number
        brand:
          type: string
        category:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        description:
          type: string
        attributes:
          type: object
          additionalProperties: {}
    WishlistResponseDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/ProductResponseDto"
        addedAt:
          type: string
          format: date-time
    UserCreateRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        firstName:
          type: string
          maxLength: 50
          minLength: 2
        lastName:
          type: string
          maxLength: 50
          minLength: 2
        sex:
          type: string
          enum:
          - M
          - F
        phoneNumber:
          type: string
          minLength: 1
        favoriteCommunicationChanel:
          type: string
          description: "E-mail or SMS. Web Push is not a choice: it is always sent\
            \ in addition, to subscribed browsers."
          enum:
          - EMAIL
          - SMS
        street:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        zipCode:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        birthDate:
          type: string
          format: date-time
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        bankCardCreationRequestDto:
          $ref: "#/components/schemas/BankCardCreationRequestDto"
      required:
      - city
      - country
      - email
      - favoriteCommunicationChanel
      - firstName
      - lastName
      - password
      - phoneNumber
      - sex
      - street
      - zipCode
    ReviewCreateRequestDto:
      type: object
      properties:
        orderUuid:
          type: string
          format: uuid
        productUuid:
          type: string
          format: uuid
        rating:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - orderUuid
      - productUuid
      - rating
    ReviewResponseDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        userUuid:
          type: string
          format: uuid
        productUuid:
          type: string
          format: uuid
        productName:
          type: string
        rating:
          type: integer
          format: int32
        comment:
          type: string
    ProductSearchRequestDto:
      type: object
      properties:
        keyword:
          type: string
        priceMin:
          type: number
          format: double
          minimum: 100
        priceMax:
          type: number
          format: double
          maximum: 1000000
        category:
          type: string
        brands:
          type: array
          items:
            type: string
            enum:
            - ASUS
            - HP
            - LENOVO
            - DELL
            - AORUS
            - MSI
            - ACER
            - TOSHIBA
            - ALIENWARE
            - MICROSOFT
            - ALTYK
            - GIGABYTE
            - SAMSUNG
            - LG
            - AOC
            - IIYAMA
            - BENQ
            - PHILIPS
            - VIEWSONIC
            - EIZO
            - CORSAIR
            - LDLC
            - XIAOMI
            - APPLE
            - GARMIN
            - HUAWEI
            - AMAZFIT
            - WITHINGS
            - GOOGLE
            - POLAR
            - SUUNTO
            - COROS
            - FITBIT
            - MOTOROLA
            - ONEPLUS
            - OPPO
            - HONOR
            - NOTHING
            - SONY
            - CROSSCALL
            - REALME
            - FAIRPHONE
            - NOKIA
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        numericRanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RangeFilter"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: string
          default: RELEVANCE
          description: "Order of the whole result set, before pagination; absent = RELEVANCE. Ties are broken by product uuid, so pages are stable. RATING_DESC lists products without reviews last."
          enum:
          - RELEVANCE
          - NAME_ASC
          - PRICE_ASC
          - PRICE_DESC
          - RATING_DESC
    RangeFilter:
      type: object
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
    FacetValueDto:
      type: object
      properties:
        value:
          type: string
          description: "Facet value, as sent back in the search filters."
          example: LENOVO
        count:
          type: integer
          format: int64
          description: "Number of products with this value, under every active filter\
            \ except this facet's own."
          example: 12
    ProductFacetsResponseDto:
      type: object
      properties:
        totalHits:
          type: integer
          format: int64
          description: "Number of products matching every filter, the same as /search's\
            \ page.totalElements."
          example: 42
        brands:
          type: array
          description: "Brands, by count descending then alphabetically."
          items:
            $ref: "#/components/schemas/FacetValueDto"
        price:
          $ref: "#/components/schemas/RangeFacetDto"
          description: Price bounds.
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/FacetValueDto"
          description: "Values of each text attribute of the category's JSON Schema,\
            \ by count descending then alphabetically. Present only when a category\
            \ is given; every text attribute of the schema is a key, possibly with\
            \ an empty list."
        numericAttributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RangeFacetDto"
          description: Bounds of each integer / number attribute of the category's
            JSON Schema. Present only when a category is given.
    RangeFacetDto:
      type: object
      properties:
        min:
          type: number
          format: double
          description: Smallest value among the matching products; null when none
            matches.
          example: 8
        max:
          type: number
          format: double
          description: Largest value among the matching products; null when none matches.
          example: 64
    PushSubscriptionKeysDto:
      type: object
      properties:
        p256dh:
          type: string
          maxLength: 256
          minLength: 0
        auth:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - auth
      - p256dh
    PushSubscriptionRequestDto:
      type: object
      properties:
        endpoint:
          type: string
          maxLength: 2048
          minLength: 0
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeysDto"
        expirationTime:
          type: integer
          format: int64
      required:
      - endpoint
      - keys
    PushSubscriptionResponseDto:
      type: object
