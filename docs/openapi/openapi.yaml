components:
  schemas:
    BankCardUpdateRequestDto:
      type: object
      properties:
        cardHolderName:
          type: string
          minLength: 1
        expiryDate:
          type: string
          minLength: 1
          pattern: "(0[1-9]|1[0-2])/[0-9]{4}"
      required:
      - cardHolderName
      - expiryDate
    BankCardResponseDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        cardHolderName:
          type: string
        maskedNumber:
          type: string
        expiryDate:
          type: string
        cardType:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMERICAN_EXPRESS
          - DISCOVER
          - OTHER
        userUuid:
          type: string
          format: uuid
    ErrorResponseDto:
      type: object
      properties:
        message:
          type: string
        httpStatusCode:
          type: integer
          format: int32
        errorCodeType:
          type: string
          enum:
          - TECHNICAL
          - FUNCTIONAL
    ProductResponseDto:
      type: object
      properties:
        name:
          type: string
        uuid:
          type: string
        price:
          type: number
        brand:
          type: string
        category:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        description:
          type: string
        attributes:
          type: object
          additionalProperties: {}
    WishlistResponseDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/ProductResponseDto"
        addedAt:
          type: string
          format: date-time
    BankCardCreationRequestDto:
      type: object
      properties:
        cardHolderName:
          type: string
          minLength: 1
        cardNumber:
          type: string
          maxLength: 19
          minLength: 13
          pattern: "\\d{13,19}"
        expiryDate:
          type: string
          minLength: 1
          pattern: "(0[1-9]|1[0-2])/[0-9]{4}"
        cardType:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - AMERICAN_EXPRESS
          - DISCOVER
          - OTHER
      required:
      - cardHolderName
      - cardNumber
      - cardType
      - expiryDate
    UserCreateRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        firstName:
          type: string
          maxLength: 50
          minLength: 2
        lastName:
          type: string
          maxLength: 50
          minLength: 2
        sex:
          type: string
          enum:
          - M
          - F
        phoneNumber:
          type: string
          minLength: 1
        favoriteCommunicationChanel:
          type: string
          enum:
          - EMAIL
          - SMS
          - PUSH_NOTIFICATION
        street:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        zipCode:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        birthDate:
          type: string
          format: date-time
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        bankCardCreationRequestDto:
          $ref: "#/components/schemas/BankCardCreationRequestDto"
      required:
      - city
      - country
      - email
      - favoriteCommunicationChanel
      - firstName
      - lastName
      - password
      - phoneNumber
      - sex
      - street
      - zipCode
    ReviewCreateRequestDto:
      type: object
      properties:
        orderUuid:
          type: string
          format: uuid
        productUuid:
          type: string
          format: uuid
        rating:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - orderUuid
      - productUuid
      - rating
    ReviewResponseDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        userUuid:
          type: string
          format: uuid
        productUuid:
          type: string
          format: uuid
        productName:
          type: string
        rating:
          type: integer
          format: int32
        comment:
          type: string
    ProductSearchRequestDto:
      type: object
      properties:
        keyword:
          type: string
        priceMin:
          type: number
          format: double
          minimum: 100
        priceMax:
          type: number
          format: double
          maximum: 1000000
        category:
          type: string
        brands:
          type: array
          items:
            type: string
            enum:
            - ASUS
            - HP
            - LENOVO
            - DELL
            - AORUS
            - MSI
            - ACER
            - TOSHIBA
            - ALIENWARE
            - MICROSOFT
            - ALTYK
            - GIGABYTE
            - SAMSUNG
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        numericRanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RangeFilter"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
    RangeFilter:
      type: object
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
    OrderItemCreateRequestDto:
      type: object
      properties:
        productUuid:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
      - productUuid
      - quantity
    OrderUpdateRequestDto:
      type: object
      description: DTO for updating an existing Order. Only provide fields that need
        to be changed.
      properties:
        uuid:
          type: string
          format: uuid
        paymentType:
          type: string
          enum:
          - MASTERCARD
          - VISA
          - APPLE_PAY
          - GOOGLE_PAY
        shippingType:
          type: string
          enum:
          - STANDARD
          - EXPRESS
        shippingProvider:
          type: string
          enum:
          - DHL
          - FEDEX
        shippingStreet:
          type: string
          minLength: 1
        shippingCity:
          type: string
          minLength: 1
        shippingZipCode:
          type: string
          minLength: 1
        shippingCountry:
          type: string
          minLength: 1
        itemUpdateRequestDtoList:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemCreateRequestDto"
          minItems: 1
      required:
      - itemUpdateRequestDtoList
      - paymentType
      - shippingCity
      - shippingCountry
      - shippingProvider
      - shippingStreet
      - shippingType
      - shippingZipCode
      - uuid
    OrderItemResponseDto:
      type: object
      properties:
        orderItemUuid:
          type: string
          format: uuid
        productUuid:
          type: string
          format: uuid
        productName:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
        lineItemTotalPrice:
          type: number
    OrderResponseDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        userUuid:
          type: string
          format: uuid
        orderDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - CREATED
          - AWAITING_PAYMENT
          - PAYMENT_FAILED
          - PAID
          - AWAITING_SHIPPING
          - SHIPPED
          - DELIVERED
          - RETURNED
          - CANCELED
          - REFUNDED
        totalAmount:
          type: number
        refundedAmount:
          type: number
        shippingAddress:
          type: string
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponseDto"
    OrderPlacingRequestDto:
      type: object
      description: OrderPlacingRequestDto for placing order
      properties:
        paymentType:
          type: string
          enum:
          - MASTERCARD
          - VISA
          - APPLE_PAY
          - GOOGLE_PAY
        shippingType:
          type: string
          enum:
          - STANDARD
          - EXPRESS
        shippingProvider:
          type: string
          enum:
          - DHL
          - FEDEX
        shippingStreet:
          type: string
          minLength: 1
        shippingCity:
          type: string
          minLength: 1
        shippingZipCode:
          type: string
          minLength: 1
        shippingCountry:
          type: string
          minLength: 1
        discountKey:
          type: string
          minLength: 1
      required:
      - discountKey
      - paymentType
      - shippingCity
      - shippingCountry
      - shippingProvider
      - shippingStreet
      - shippingType
      - shippingZipCode
    OrderCancellationRequestDto:
