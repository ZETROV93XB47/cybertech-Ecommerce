        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =================== USER EVENTS ===================
  /api/v1/events/consume-event:
    post:
      tags: [User Events]
      summary: Ingest a behavioural user event (USER role required)
      description: |
        Accepts click / view / purchase events for the recommendation engine.
        The server overwrites the supplied `userId` with the JWT subject
        (BUG-SPOOF-D5) so events are always attributed to the calling user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserEventDto' }
      responses:
        '201':
          description: Event accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # =================== STRIPE WEBHOOK ===================
  /api/v1/webhooks/stripe:
    post:
      tags: [Stripe Webhook]
      summary: Stripe webhook ingestion endpoint
      description: |
        Public endpoint (no JWT) — authentication is performed via the
        `Stripe-Signature` HMAC-SHA256 header verified against the configured
        `stripe.webhook.secret`.

        Response codes are calibrated to Stripe's retry semantics:
        - 200: event accepted OR non-retriable downstream failure (BUG-2501).
        - 400: invalid signature (BUG-2501 carve-out) OR malformed JSON
          (BUG-2502).
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
          description: Stripe-issued HMAC-SHA256 signature header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload
      responses:
        '200':
          description: Webhook accepted (or non-retriable downstream failure ACKed)
        '400':
          description: Invalid Stripe signature or malformed event payload
