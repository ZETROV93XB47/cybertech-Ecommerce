# ======================================================================================
# Production profile — minikube deployment (Helm + nginx-ingress)
# ======================================================================================
# Activated via SPRING_PROFILES_ACTIVE=prod injected by the Helm chart container env
# (NOT via spring.profiles.active here — keep activation out of the JAR).
#
# Hostnames below are Helm chart service names resolved by in-cluster DNS:
#   mysql, mongodb, redis, elasticsearch, keycloak, localstack, mailpit, vault,
#   moderation-api.
# Frontend ingress: cybertech.local — Backend ingress: api.cybertech.local
# (mapped via /etc/hosts to the minikube IP).
#
# All secrets MUST be Vault-injected via ${vault.<path>.<key>} placeholders. NEVER
# commit plaintext credentials in this file.
# ======================================================================================


# --------------------------------------------------------------------------------------
# Server / forward-headers
# --------------------------------------------------------------------------------------
# server.port stays at 8081 (matches application.properties default — no override needed).
# nginx-ingress terminates TLS and forwards via X-Forwarded-Proto; framework strategy
# makes Spring honour the original scheme so generated URLs (emails, redirects) use https.
server.forward-headers-strategy=framework


# --------------------------------------------------------------------------------------
# MySQL
# --------------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://mysql:3306/cybertech?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${vault.mysql.username}
spring.datasource.password=${vault.mysql.password}

# In prod we never let Hibernate touch the schema. Flyway (or a DBA-owned migration
# pipeline) is the source of truth; `validate` fails fast on drift instead of mutating.
spring.jpa.hibernate.ddl-auto=validate


# --------------------------------------------------------------------------------------
# MongoDB
# --------------------------------------------------------------------------------------
spring.data.mongodb.uri=mongodb://mongodb:27017/cybertech


# --------------------------------------------------------------------------------------
# Redis
# --------------------------------------------------------------------------------------
spring.data.redis.host=redis
spring.data.redis.port=6379


# --------------------------------------------------------------------------------------
# Elasticsearch
# --------------------------------------------------------------------------------------
spring.elasticsearch.uris=http://elasticsearch:9200


# --------------------------------------------------------------------------------------
# Kafka — intentionally OMITTED.
# --------------------------------------------------------------------------------------
# The repo has no active KafkaTemplate / @KafkaListener usage; the only reference is a
# fully-commented stub in events/consumer/ProductElasticConsumer.java. Catalogue events
# flow through ApplicationEventPublisher + @TransactionalEventListener(AFTER_COMMIT) for
# now. Add spring.kafka.bootstrap-servers here only when a real consumer/producer ships.


# --------------------------------------------------------------------------------------
# Keycloak / OAuth2 resource server
# --------------------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/cybertech
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/cybertech/protocol/openid-connect/certs

# Admin client used by the user-management service to provision Keycloak users / roles.
keycloak.client.user.management.realm=cybertech
keycloak.client.user.management.server.url=http://keycloak:8080
keycloak.client.user.management.client.id=cybertech-user-management-client
keycloak.client.user.management.client.secret=${vault.keycloak.client-secret}


# --------------------------------------------------------------------------------------
# Stripe
# --------------------------------------------------------------------------------------
stripe.api.key=${vault.stripe.api-key}
stripe.webhook.secret=${vault.stripe.webhook-secret}
# BUG-522: prod still runs against a mock Stripe in-cluster (portfolio scope), so
# event.livemode stays false. Flip to true the day a real Stripe account is wired.
stripe.livemode=false


# --------------------------------------------------------------------------------------
# AWS S3 (LocalStack in-cluster)
# --------------------------------------------------------------------------------------
# LocalStack requires path-style addressing (no DNS-style virtual hosts on a single host).
# Credentials are dummy values accepted by LocalStack — left inline because they are NOT
# secrets in the LocalStack threat model and the Vault path would be empty anyway.
spring.cloud.aws.s3.endpoint=http://localstack:4566
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.s3.path-style-access-enabled=true


# --------------------------------------------------------------------------------------
# Mail (Mailpit in-cluster — intentional for portfolio scope)
# --------------------------------------------------------------------------------------
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Application-level "from" address used by OrdersSummaryReportListener and the rest of
# the notification stack (key name is `email.sender.address` — see application.properties).
email.sender.address=no-reply@cybertech.local


# --------------------------------------------------------------------------------------
# External services
# --------------------------------------------------------------------------------------
# moderation-api Helm chart exposes port 5000 with the /analyze endpoint
# (see src/main/resources/k8s/helm/charts/moderation-api-chart/values.yaml).
moderation.api.url=http://moderation-api:5000/analyze

# Frontend URL used in transactional emails (password reset, order links, etc.).
application.frontend.url=https://cybertech.local


# --------------------------------------------------------------------------------------
# Vault
# --------------------------------------------------------------------------------------
# Vault wiring is owned by bootstrap config + the Helm chart env (SPRING_CLOUD_VAULT_TOKEN
# from the Kubernetes Secret). We only need to flip the flag on here — the URI / kv
# settings carry over from application.properties.
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=http://vault:8200


# --------------------------------------------------------------------------------------
# Logging — keep INFO in prod (no DEBUG noise, no PII leakage from request-detail logs).
# --------------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.novatech.cybertech=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.tomcat.util.http.fileupload=INFO
logging.level.org.springframework.web.multipart=INFO
spring.http.log-request-details=false


# --------------------------------------------------------------------------------------
# CORS
# --------------------------------------------------------------------------------------
# CORS is NOT currently configured in the codebase: SecurityConfig.java does not call
# .cors(...) and there is no CorsConfiguration / WebMvcConfigurer bean defined. nginx-
# ingress will be the de-facto CORS policy enforcer for now (same-site cybertech.local
# fronting api.cybertech.local). When CORS moves into Spring (owned by the SecurityConfig
# agent), add the property keys here:
#   cybertech.cors.allowed-origins=https://cybertech.local,http://cybertech.local
