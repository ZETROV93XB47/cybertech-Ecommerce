apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: cybertech-minikube
        environment: dev

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: {{ .Values.scrape.cybertechApp.job | quote }}
        metrics_path: {{ .Values.scrape.cybertechApp.metricsPath | quote }}
        scrape_interval: {{ .Values.scrape.cybertechApp.scrapeInterval }}
        static_configs:
          - targets:
              - "{{ .Values.scrape.cybertechApp.host }}:{{ .Values.scrape.cybertechApp.port }}"
            labels:
              app: cybertech-app
              tier: backend

      # Optional service-discovery for the cybertech-app Service. Kept commented
      # because a static target is sufficient on minikube and SD requires RBAC
      # we do not provision in this chart. Uncomment if you switch to a
      # dedicated ServiceAccount + ClusterRole binding.
      # - job_name: cybertech-app-sd
      #   kubernetes_sd_configs:
      #     - role: pod
      #       namespaces:
      #         names: [default]
      #   relabel_configs:
      #     - source_labels: [__meta_kubernetes_pod_label_app]
      #       action: keep
      #       regex: cybertech-app

      {{- if .Values.selfScrape.enabled }}
      - job_name: prometheus
        scrape_interval: {{ .Values.selfScrape.scrapeInterval }}
        static_configs:
          - targets: ["localhost:9090"]
      {{- end }}
