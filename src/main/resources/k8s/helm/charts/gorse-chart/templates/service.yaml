apiVersion: v1
kind: Service
metadata:
  name: gorse
  labels:
    {{- include "gorse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: gorse
    app.kubernetes.io/instance: {{ .Release.Name }}
