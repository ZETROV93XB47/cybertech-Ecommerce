apiVersion: v1
kind: Secret
metadata:
  name: gorse-secret
  labels:
    {{- include "gorse.labels" . | nindent 4 }}
type: Opaque
stringData:
  GORSE_DATA_STORE: {{ printf "mysql://%s:%s@tcp(%s:%v)/%s" .Values.mysql.username .Values.mysql.password .Values.mysql.host .Values.mysql.port .Values.mysql.database | quote }}
