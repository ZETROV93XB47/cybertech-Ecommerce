apiVersion: apps/v1
kind: Deployment
metadata:
  name: gorse
  labels:
    {{- include "gorse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gorse
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gorse
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gorse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: GORSE_CACHE_STORE
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            - name: GORSE_DATA_STORE
              valueFrom:
                secretKeyRef:
                  name: gorse-secret
                  key: GORSE_DATA_STORE
          volumeMounts:
            - name: config
              mountPath: /etc/gorse/config.toml
              subPath: config.toml
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: gorse-config
