elasticsearch:
  image: elasticsearch:9.2.5
  port: 9200

  heap: "512m"

  persistence:
    enabled: true
    size: 5Gi
    # IMPORTANT: StatefulSet crée 1 PVC par replica via volumeClaimTemplates
    # Ne pas créer de PVC séparé

service:
  type: ClusterIP
  #::::clusterIP: None  # Headless service for StatefulSet DNS

env:
  discoveryType: "single-node"
  xpackSecurity: "false"
  xpackSecurityHttpSsl: "false"