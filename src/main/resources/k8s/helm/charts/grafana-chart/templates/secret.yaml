# REPLACE in real deploy via Vault: source admin password from a Vault Agent
# injected file under /vault/secrets/grafana-admin and remove this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    app: grafana
type: Opaque
stringData:
  admin-user: {{ .Values.admin.user | quote }}
  admin-password: {{ .Values.admin.password | quote }}
