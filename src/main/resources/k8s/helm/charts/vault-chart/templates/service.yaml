apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app: vault
spec:
  type: {{ .Values.service.type }}
  selector:
    app: vault
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8200
      protocol: TCP
    - name: cluster
      port: 8201
      targetPort: 8201
      protocol: TCP