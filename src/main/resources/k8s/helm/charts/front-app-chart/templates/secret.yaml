apiVersion: v1
kind: Secret
metadata:
  name: {{ include "front-app.fullname" . }}-secret
  labels:
    {{- include "front-app.labels" . | nindent 4 }}
type: Opaque
# These should come from Vault — see runbook
# (src/main/resources/k8s/helm/README.md). The placeholder values
# in values.yaml exist only so `helmfile apply` against minikube
# works end-to-end without a Vault round-trip.
stringData:
  AUTH_SECRET: {{ .Values.secrets.AUTH_SECRET | quote }}
  AUTH_KEYCLOAK_ID: {{ .Values.secrets.AUTH_KEYCLOAK_ID | quote }}
  AUTH_KEYCLOAK_SECRET: {{ .Values.secrets.AUTH_KEYCLOAK_SECRET | quote }}
  AUTH_KEYCLOAK_ISSUER: {{ .Values.secrets.AUTH_KEYCLOAK_ISSUER | quote }}
