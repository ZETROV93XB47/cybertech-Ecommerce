apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "front-app.fullname" . }}
  labels:
    {{- include "front-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "front-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "front-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: front
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Next 16 standalone server entrypoint baked into the image.
          # The Dockerfile copies `.next/standalone/server.js` to /app.
          command: ["node", "/app/server.js"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # Secrets pulled from the front-app-secret object.
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "front-app.fullname" . }}-secret
                  key: AUTH_SECRET
            - name: AUTH_KEYCLOAK_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "front-app.fullname" . }}-secret
                  key: AUTH_KEYCLOAK_ID
            - name: AUTH_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "front-app.fullname" . }}-secret
                  key: AUTH_KEYCLOAK_SECRET
            - name: AUTH_KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ include "front-app.fullname" . }}-secret
                  key: AUTH_KEYCLOAK_ISSUER
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
