apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybertech-app
  labels:
    app: cybertech-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cybertech-app
  template:
    metadata:
      labels:
        app: cybertech-app
    spec:
      containers:
        - name: cybertech-app
          image: cybertech-app:latest
          ports:
            - containerPort: 8081

          env:
            # --- MySQL ---
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/cybertechDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: rookie
            - name: SPRING_DATASOURCE_PASSWORD
              value: pwd

            # --- Elasticsearch ---
            - name: SPRING_ELASTICSEARCH_URIS
              value: http://elasticsearch:9200

            # --- Moderation API ---
            - name: MODERATION_API_URL
              value: http://moderation-api:5000/analyze

            # --- Mailpit ---
            - name: SPRING_MAIL_HOST
              value: mailpit
            - name: SPRING_MAIL_PORT
              value: "1025"

            # --- Keycloak ---
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://keycloak:8080/realms/cybertech
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak:8080/realms/cybertech/protocol/openid-connect/certs

            # --- Frontend URL ---
            - name: APPLICATION_FRONTEND_URL
              value: http://localhost:4200

          # --- Probes ---
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: cybertech-app
spec:
  type: NodePort
  selector:
    app: cybertech-app
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
