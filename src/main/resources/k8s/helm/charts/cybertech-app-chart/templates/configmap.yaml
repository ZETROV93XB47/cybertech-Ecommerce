apiVersion: v1
kind: ConfigMap
metadata:
  name: cybertech-app-config
data:
  application.properties: |
    server.port={{ .Values.cybertechApp.port }}

    spring.datasource.url=jdbc:mysql://{{ .Values.mysql.host }}:{{ .Values.mysql.port }}/{{ .Values.mysql.database }}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    spring.datasource.username={{ .Values.mysql.username }}

    spring.jpa.hibernate.ddl-auto=create
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
    spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    spring.mail.host={{ .Values.mailpit.host }}
    spring.mail.port={{ .Values.mailpit.port }}
    spring.mail.protocol=smtp
    spring.mail.properties.mail.smtp.auth=false
    spring.mail.properties.mail.smtp.starttls.enable=false
    spring.mail.properties.mail.smtp.starttls.required=false

    spring.data.elasticsearch.client.endpoints=http://{{ .Values.elasticsearch.host }}:{{ .Values.elasticsearch.port }}

    moderation.api.url={{ .Values.moderationApi.url }}

    spring.security.oauth2.resourceserver.jwt.issuer-uri=http://{{ .Values.keycloak.host }}:{{ .Values.keycloak.port }}/realms/{{ .Values.keycloak.realm }}
    spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://{{ .Values.keycloak.host }}:{{ .Values.keycloak.port }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs

    application.frontend.url={{ .Values.frontend.url }}
