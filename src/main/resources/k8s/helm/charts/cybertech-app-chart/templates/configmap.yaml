apiVersion: v1
kind: ConfigMap
metadata:
  name: cybertech-app-config
  labels:
    app: cybertech-app
data:
  application.properties: |
    # ============================================================
    # APPLICATION BASICS
    # ============================================================
    spring.application.name=cybertech
    server.port={{ .Values.cybertechApp.port }}
    spring.profiles.active=kubernetes

    # ============================================================
    # DATABASE CONFIGURATION (MySQL)
    # ============================================================
    spring.datasource.url=jdbc:mysql://{{ .Values.mysql.host }}:{{ .Values.mysql.port }}/{{ .Values.mysql.database }}?useSSL={{ .Values.mysql.sslEnabled }}&allowPublicKeyRetrieval={{ .Values.mysql.allowPublicKeyRetrieval }}&serverTimezone={{ .Values.mysql.serverTimezone }}
    spring.datasource.username={{ .Values.mysql.username }}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

    # ============================================================
    # JPA/HIBERNATE CONFIGURATION
    # ============================================================
    spring.jpa.hibernate.ddl-auto={{ .Values.spring.jpa.hibernateDdlAuto }}
    spring.jpa.show-sql={{ .Values.spring.jpa.showSql }}
    spring.jpa.properties.hibernate.format_sql={{ .Values.spring.jpa.formatSql }}
    spring.jpa.properties.hibernate.dialect={{ .Values.spring.jpa.dialect }}
    spring.jpa.hibernate.naming.physical-strategy={{ .Values.spring.jpa.namingStrategy }}

    # ============================================================
    # MAIL CONFIGURATION (MailPit)
    # ============================================================
    spring.mail.host={{ .Values.mailpit.host }}
    spring.mail.port={{ .Values.mailpit.port }}
    spring.mail.protocol={{ .Values.mailpit.protocol }}
    spring.mail.properties.mail.smtp.auth={{ .Values.mailpit.auth }}
    spring.mail.properties.mail.smtp.starttls.enable={{ .Values.mailpit.starttls.enabled }}
    spring.mail.properties.mail.smtp.starttls.required={{ .Values.mailpit.starttls.required }}
    spring.mail.properties.mail.smtp.connectiontimeout={{ .Values.mailpit.timeout.connection }}
    spring.mail.properties.mail.smtp.timeout={{ .Values.mailpit.timeout.send }}
    spring.mail.properties.mail.smtp.writetimeout={{ .Values.mailpit.timeout.write }}
    email.sender.address={{ .Values.mailpit.senderEmail }}

    # ============================================================
    # ELASTICSEARCH CONFIGURATION
    # ============================================================
    spring.elasticsearch.uris=http://{{ .Values.elasticsearch.host }}:{{ .Values.elasticsearch.port }}

    # ============================================================
    # REDIS CACHE CONFIGURATION
    # ============================================================
    spring.cache.type={{ .Values.redis.cacheType }}
    spring.data.redis.host={{ .Values.redis.host }}
    spring.data.redis.port={{ .Values.redis.port }}
    spring.data.redis.timeout={{ .Values.redis.timeout }}
    redis.time-to-live={{ .Values.redis.cacheTtl }}
    cache-null-values=false

    # ============================================================
    # MONGODB CONFIGURATION
    # ============================================================
    spring.data.mongodb.uri=mongodb://{{ .Values.mongodb.host }}:{{ .Values.mongodb.port }}/{{ .Values.mongodb.database }}    
    logging.level.org.springframework.data.mongodb.core={{ index .Values.logging.level "org.springframework.data.mongodb.core" }}

    # ============================================================
    # BATCH JOB CONFIGURATION
    # ============================================================
    spring.batch.job.enabled={{ .Values.spring.batch.jobEnabled }}
    spring.batch.jdbc.initialize-schema={{ .Values.spring.batch.jdbcInitializeSchema }}
    spring.batch.jdbc.isolation-level-for-create={{ .Values.spring.batch.jdbcIsolationLevel }}

    # Orders Update Job
    cybertech.orders.update.job.activated={{ .Values.jobs.ordersUpdate.activated }}
    cybertech.orders.update.job.cron={{ .Values.jobs.ordersUpdate.cron }}

    # Stock Cleanup Job
    cybertech.stock.cleanup.job.activated={{ .Values.jobs.stockCleanup.activated }}
    cybertech.stock.cleanup.job.cron={{ .Values.jobs.stockCleanup.cron }}

    # ============================================================
    # KEYCLOAK / OAUTH2 / JWT CONFIGURATION
    # ============================================================
    spring.security.oauth2.resourceserver.jwt.issuer-uri=http://{{ .Values.keycloak.host }}:{{ .Values.keycloak.port }}/realms/{{ .Values.keycloak.realm }}
    spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://{{ .Values.keycloak.host }}:{{ .Values.keycloak.port }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs

    keycloak.client.user.management.realm={{ .Values.keycloak.realm }}
    keycloak.client.user.management.server.url=http://{{ .Values.keycloak.host }}:{{ .Values.keycloak.port }}
    keycloak.client.user.management.client.id={{ .Values.keycloak.clientId }}

    # ============================================================
    # VAULT CONFIGURATION
    # ============================================================
    
    spring.cloud.vault.enabled=false
    
    {{- if .Values.vault.enabled }}
    #    spring.config.import=vault://
    #    spring.cloud.vault.uri=http://{{ .Values.vault.host }}:{{ .Values.vault.port }}
    #    spring.cloud.vault.authentication={{ .Values.vault.authentication }}
    #    spring.cloud.vault.kv.enabled={{ .Values.vault.kv.enabled }}
    #    spring.cloud.vault.kv.backend={{ .Values.vault.kv.backend }}
    #    spring.cloud.vault.kv.default-context={{ .Values.vault.kv.defaultContext }}
    #    spring.cloud.vault.kv.profile-separator={{ .Values.vault.kv.profileSeparator }}
    #    {{- end }}

    # ============================================================
    # LOCALSTACK / AWS S3 CONFIGURATION
    # ============================================================
    spring.cloud.aws.s3.endpoint={{ .Values.aws.s3.endpoint }}
    spring.cloud.aws.credentials.access-key={{ .Values.aws.s3.accessKeyId }}
    spring.cloud.aws.region.static={{ .Values.aws.s3.region }}
    spring.cloud.aws.s3.path-style-access-enabled={{ .Values.aws.s3.pathStyleAccessEnabled }}
    application.bucket.name={{ .Values.aws.s3.bucket }}

    # ============================================================
    # EXTERNAL API CONFIGURATION
    # ============================================================
    moderation.api.url={{ .Values.moderationApi.url }}

    # ============================================================
    # FRONTEND CONFIGURATION
    # ============================================================
    application.frontend.url={{ .Values.frontend.url }}

    # ============================================================
    # STRIPE CONFIGURATION
    # ============================================================
    {{- if .Values.stripe.enabled }}
    stripe.webhook.secret=PLACEHOLDER_USE_SECRET
    {{- end }}

    # ============================================================
    # CACHE CONFIGURATION
    # ============================================================
    app.cache.max.ttl.jitter.time.seconds={{ .Values.spring.cache.maxTtlJitterSeconds }}
    app.cache.default.ttl.expiration.time.seconds={{ .Values.spring.cache.defaultTtlExpirationSeconds }}

    # ============================================================
    # FILE UPLOAD CONFIGURATION
    # ============================================================
    spring.servlet.multipart.max-file-size={{ .Values.spring.upload.maxFileSize }}
    spring.servlet.multipart.max-request-size={{ .Values.spring.upload.maxRequestSize }}
    server.tomcat.max-part-count={{ .Values.spring.upload.maxPartCount }}

    # ============================================================
    # COMPRESSION CONFIGURATION
    # ============================================================
    server.compression.enabled={{ .Values.spring.compression.enabled }}
    server.compression.mime-types={{ .Values.spring.compression.mimeTypes | join "," }}
    server.compression.min-response-size={{ .Values.spring.compression.minResponseSize }}

    # ============================================================
    # LOGGING CONFIGURATION
    # ============================================================
    logging.level.root={{ .Values.logging.level.root }}
    logging.level.org.springframework.security={{ index .Values.logging.level "org.springframework.security" }}
    logging.level.org.springframework.web={{ index .Values.logging.level "org.springframework.web" }}
    logging.level.org.apache.tomcat.util.http.fileupload={{ index .Values.logging.level "org.apache.tomcat.util.http.fileupload" }}
    logging.level.org.springframework.web.multipart={{ index .Values.logging.level "org.springframework.web.multipart" }}
    spring.http.log-request-details={{ .Values.logging.logRequestDetails }}

    # ============================================================
    # SPRING BOOT CONFIGURATION
    # ============================================================
    spring.main.allow-bean-definition-overriding=true
    spring.threads.virtual.enabled={{ .Values.spring.virtualThreadsEnabled }}

    # ============================================================
    # API VERSIONING
    # ============================================================
    spring.mvc.apiversion.default={{ .Values.application.apiVersion.default }}
    spring.mvc.apiversion.enabled={{ .Values.application.apiVersion.enabled }}
    spring.mvc.apiversion.supported={{ .Values.application.apiVersion.supported }}
    spring.mvc.apiversion.use.header={{ .Values.application.apiVersion.useHeader }}

    # ============================================================
    # APPLICATION SPECIFIC CONFIGURATION
    # ============================================================
    time-before-deleting-order={{ .Values.application.email.timeBeforeDeletingOrder }}

