apiVersion: v1
kind: Secret
metadata:
  name: cybertech-app-secret
  labels:
    app: cybertech-app
type: Opaque
stringData:
  # ============================================================
  # DATABASE CREDENTIALS
  # ============================================================
  SPRING_DATASOURCE_PASSWORD: "{{ .Values.mysql.password }}"

  # ============================================================
  # KEYCLOAK CREDENTIALS
  # ============================================================
  KEYCLOAK_CLIENT_USER_MANAGEMENT_CLIENT_SECRET: "{{ .Values.keycloak.clientSecret }}"

  # ============================================================
  # STRIPE CREDENTIALS (SENSITIVE!)
  # ============================================================
  {{- if .Values.stripe.enabled }}
  STRIPE_API_KEY: "{{ .Values.stripe.apiKey }}"
  STRIPE_WEBHOOK_SECRET: "{{ .Values.stripe.webhookSecret }}"
  {{- end }}

  # ============================================================
  # AWS/S3 CREDENTIALS
  # ============================================================
  SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: "{{ .Values.aws.s3.secretAccessKey }}"

  # ============================================================
  # VAULT TOKEN (FOR VAULT ACCESS)
  # ============================================================
  {{- if .Values.vault.enabled }}
  SPRING_CLOUD_VAULT_TOKEN: "{{ .Values.vault.token }}"
  {{- end }}
