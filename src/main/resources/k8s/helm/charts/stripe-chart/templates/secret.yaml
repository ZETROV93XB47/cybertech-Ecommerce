apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  labels:
    app: stripe
type: Opaque
data:
  {{- if .Values.stripe.apiKey }}
  api-key: {{ .Values.stripe.apiKey | b64enc | quote }}
  {{- else }}
  # WARNING: API Key not provided. Set via: --set stripe.apiKey=sk_test_xxx
  api-key: ""
  {{- end }}

