apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe
  labels:
    app: stripe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stripe
  template:
    metadata:
      annotations:
        # Rolls the pod when a secret changes; env vars are only read at start-up.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: stripe
    spec:
      containers:
        # `stripe listen` is an outbound client (it forwards Stripe events to the backend);
        # it opens no port, so there is no Service and no TCP probe.
        - name: stripe
          image: {{ .Values.stripe.image }}
          command:
            - stripe
            - listen
            - --api-key
            - $(STRIPE_API_KEY)
            - --forward-to
            - {{ .Values.stripe.webhookUrl }}
            - --events
            - {{ .Values.stripe.events | join "," }}
          env:
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: api-key
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}

