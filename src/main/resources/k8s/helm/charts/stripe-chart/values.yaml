stripe:
  image: stripe/stripe-cli:v1.37.1
  # API Key - DOIT être fourni via --set ou secrets
  # Exemple: helm install stripe-release ./stripe-chart --set stripe.apiKey=sk_test_xxx
  apiKey: ""  # À passer via variable d'environnement ou secret
  webhookUrl: "http://cybertech-app:8081/api/v1/webhooks/stripe"
  # Events to listen for
  events:
    - "payment_intent.succeeded"
    - "payment_intent.payment_failed"
    - "checkout.session.completed"
    - "charge.refunded"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Configuration de sécurité
secretProvider: "kubernetes"  # "kubernetes", "vault", ou "env"

