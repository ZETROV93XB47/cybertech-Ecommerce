# --------------------------------------------------------------------------------------
# Spring Boot Actuator
# --------------------------------------------------------------------------------------
# Expose details so /actuator/health surfaces the per-indicator status (Redis / Mongo / ES).
# A 503 with a body of {"groups":["liveness","readiness"],"status":"DOWN"} otherwise hides
# which downstream is unhealthy and makes IT triage painful.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# Mail health probe needs an SMTP handshake we don't run in CI; skip it so /health stays UP.
management.health.mail.enabled=false
# Elasticsearch health indicator is enabled — server (Helm chart 8.15.3 +
# Testcontainers 8.15.3) is now aligned with the Spring Data ES 5.x / co.elastic
# 8.x client, so cluster.health responses decode cleanly.

# --------------------------------------------------------------------------------------
# Observability (Task 5b) — metrics, tracing, logs
# --------------------------------------------------------------------------------------
# Endpoint exposure: kubelet probes (/health) + portfolio info (/info) + Prometheus
# scrape target (/prometheus). Other actuator endpoints stay unexposed to keep the
# attack surface minimal; if a future runbook needs `loggers` or `env`, add them here.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
# Application tag pinned across all metrics so Prometheus / Grafana queries can filter
# by `application="cybertech-app"` (Helm chart values.yaml uses the same convention).
management.metrics.tags.application=cybertech-app
# 100% trace sampling is fine for portfolio scope (low traffic). In real production this
# would drop to 0.05–0.10 to keep Tempo storage bounded.
management.tracing.sampling.probability=1.0
# OTLP/HTTP endpoints — match the Helm chart Service names emitted by the parallel
# observability-charts agent (tempo Service on port 4318, prometheus Service on 9090).
# Override per environment via env vars (MANAGEMENT_OTLP_TRACING_ENDPOINT etc.) if the
# observability stack lives in a different namespace / under a different DNS suffix.
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
management.otlp.metrics.export.url=http://prometheus:9090/api/v1/otlp