spring.datasource.url=jdbc:mysql://localhost:3306/cybertechDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Options JPA/Hibernate (optionnel, mais souvent utile)
spring.jpa.hibernate.ddl-auto=update
# ou validate, none. Attention avec 'create' ou 'create-drop' en prod.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Utilise le nom physique exact défini dans le code ou le SQL
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

moderation.api.url=http://moderation-api:5000/analyze

# Configuration pour MailHog
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.protocol=smtp

# Desactivation explicite du chiffrement (Crucial pour MailHog)
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Optionnel : Timeout pour eviter que le thread reste bloque
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000


#spring.data.elasticsearch.repositories.enabled=false

spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=yourpassword

#Config for Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.isolation-level-for-create=read_committed

cybertech.orders.update.job.activated=true
#cybertech.orders.update.job.cron=0 0 1 * * *
cybertech.orders.update.job.cron=0 * * * * *

# Configuration Spring Security OAuth2/OIDC
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/cybertech
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/cybertech/protocol/openid-connect/certs

logging.level.org.springframework.security=DEBUG


# Keycloak configuration for Admin Account for managing users and roles
keycloak.client.user.management.realm=cybertech
keycloak.client.user.management.server.url=http://localhost:8080
