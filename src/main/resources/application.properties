# --------------------------------------------------------------------------------------
# Notification redelivery batch job (Phase 3 long-tail safety net)
# --------------------------------------------------------------------------------------
# Scans the notificationTable for rows in status=PENDING_RETRY whose
# lastAttemptAt is older than `backoff-minutes`, then resubmits them through
# NotificationRetryableDelivery — the SAME @Retry-protected bean used by the
# in-process listener path. After max-attempts cumulative attempts, rows are
# promoted to terminal status=FAILED.
cybertech.notification.redelivery.job.activated=true
cybertech.notification.redelivery.job.cron=0 */15 * * * *
cybertech.notification.redelivery.max-attempts=9
cybertech.notification.redelivery.backoff-minutes=10
cybertech.notification.redelivery.batch-size=50

# --------------------------------------------------------------------------------------
# Notification dispatch — in-process retry policy (Phase 2)
# --------------------------------------------------------------------------------------
# Knobs surfaced under the cybertech.* namespace so they sit alongside the
# other feature toggles (cybertech.stock.cleanup.*, cybertech.orders.update.*)
# instead of forcing operators to know the resilience4j key path. The
# resilience4j.retry.instances.notificationDispatch.* block below pulls the
# numeric values from these keys via property interpolation, so changing a
# value here changes it everywhere.
cybertech.notification.dispatch.max-attempts=3
cybertech.notification.dispatch.wait-duration=500ms
cybertech.notification.dispatch.exponential-backoff-multiplier=2

# --------------------------------------------------------------------------------------
# Resilience4j @Retry instance: notificationDispatch
# --------------------------------------------------------------------------------------
# Used by NotificationRetryableDeliveryImp.attemptDispatch to retry transient
# notification-delivery failures (SMTP blips, MIME setup glitches that surface
# as MailException / MessagingException — both normalized to
# NotificationDeliveryException by MailServiceImp in Phase 1).
#
# Lifecycle:
#   1. The @Retry advice catches NotificationDeliveryException, sleeps for
#      wait-duration * (multiplier ^ (attempt - 1)), and re-invokes the
#      annotated method.
#   2. After max-attempts have failed, Resilience4j routes the call to the
#      fallback method (onRetriesExhausted), which writes a NotificationEntity
#      row with status=PENDING_RETRY (NOT terminal FAILED).
#   3. The Phase 3 batch tasklet scans PENDING_RETRY rows on a cron and
#      resubmits them through the same retryable bean. Only when the batch
#      tasklet itself gives up does the row flip to terminal FAILED.
#
# ignore-exceptions: NoStrategyFoundForProcessingTheRequest is programmer
# error (a missing/typo'd notification type or channel binding) — retrying
# would only burn budget and delay surfacing the bug. Fallback fires
# immediately for those.
resilience4j.retry.instances.notificationDispatch.max-attempts=${cybertech.notification.dispatch.max-attempts}
resilience4j.retry.instances.notificationDispatch.wait-duration=${cybertech.notification.dispatch.wait-duration}
resilience4j.retry.instances.notificationDispatch.enable-exponential-backoff=true
resilience4j.retry.instances.notificationDispatch.exponential-backoff-multiplier=${cybertech.notification.dispatch.exponential-backoff-multiplier}
resilience4j.retry.instances.notificationDispatch.retry-exceptions[0]=com.novatech.cybertech.exceptions.NotificationDeliveryException
resilience4j.retry.instances.notificationDispatch.retry-exceptions[1]=org.springframework.mail.MailException
resilience4j.retry.instances.notificationDispatch.ignore-exceptions[0]=com.novatech.cybertech.exceptions.NoStrategyFoundForProcessingTheRequest

