services:

  # =========================================================
  # DATABASES
  # =========================================================

  mysql:
    image: mysql:9.3.0
    container_name: mysqlEcommerce
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cybertechDB
      MYSQL_USER: rookie
      MYSQL_PASSWORD: pwd
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - $PWD/../sql/databaseSchemaInitFile.sql:/docker-entrypoint-initdb.d/1_databaseSchemaInitFile.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-net

  mongodb:
    image: mongo:8.2.5
    container_name: mongodbEcommerce
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: userEventsDB
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-net

  redis:
    image: redis:latest
    container_name: redisEcommerce
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  # =========================================================
  # SEARCH / RECOMMENDATION
  # =========================================================

  elasticsearch:
    image: elasticsearch:9.2.5
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-net

  gorse:
    image: zhenghaoz/gorse-in-one:latest
    container_name: gorse
    restart: unless-stopped
    environment:
      GORSE_CACHE_STORE: redis://redisEcommerce:6379
      GORSE_DATA_STORE: mysql://rookie:pwd@tcp(mysql:3306)/cybertechDB
    ports:
      - "8088:8088"
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # =========================================================
  # AUTH / SECRETS / CLOUD MOCK
  # =========================================================

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    restart: unless-stopped
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloakDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KC_DB_USERNAME: rookie
      KC_DB_PASSWORD: pwd
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost:8080
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY: edge
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      # Custom Cybertech login theme (overrides login/register/forgot/error pages
      # with the Material 3 design tokens used by the Next.js front-end).
      # Activate it from the admin UI: Realm settings -> Themes -> Login theme.
      - ./../keycloak/themes/cybertech:/opt/keycloak/themes/cybertech:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-net

  localstack:
    image: localstack/localstack:4.13.1
    container_name: localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Forwarded to init-aws.sh so the bucket name stays in sync with
      # application.bucket.name (Spring) and aws.s3.bucket (Helm chart).
      BUCKET_NAME: cybertech-products
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      # Auto-create the S3 bucket + open CORS for the Next.js dev origin.
      # Mounted into /etc/localstack/init/ready.d/ so LocalStack runs it
      # exactly once when the edge service reports ready.
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    networks:
      - ecommerce-net

  vault:
    image: hashicorp/vault:1.21.4
    container_name: vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
    command: vault server -dev
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    networks:
      - ecommerce-net

  # =========================================================
  # SUPPORTING SERVICES
  # =========================================================

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    environment:
      MP_DATA_FILE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - ./mailpit-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - ecommerce-net

  moderation-api:
    build:
      context: ../../java/com/novatech/cybertech/api/external/moderation/
    container_name: moderation-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - ecommerce-net

  stripe:
    image: stripe/stripe-cli:v1.37.1
    container_name: stripe-cli
    restart: unless-stopped
    command: >
      listen
      --api-key sk_test_VePHdqKTYQjKNInc7u56JBrQ
      --forward-to http://host.docker.internal:8081/api/v1/webhooks/stripe
      --events payment_intent.succeeded,payment_intent.payment_failed,checkout.session.completed,charge.refunded
    environment:
      STRIPE_API_KEY: sk_test_VePHdqKTYQjKNInc7u56JBrQ
    networks:
      - ecommerce-net

volumes:
  mysql_data:
    driver: local
  mongodb_data:
    driver: local
  esdata:
    driver: local
  localstack_data:
    driver: local

networks:
  ecommerce-net:
    driver: bridge