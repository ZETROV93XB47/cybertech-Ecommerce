services:

  # =========================================================
  # DATABASES
  # =========================================================

  mysql:
    image: mysql:9.3.0
    container_name: mysqlEcommerce
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cybertechDB
      MYSQL_USER: rookie
      MYSQL_PASSWORD: pwd
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - $PWD/../sql/databaseSchemaInitFile.sql:/docker-entrypoint-initdb.d/1_databaseSchemaInitFile.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-net

  mongodb:
    image: mongo:8.2.5
    container_name: mongodbEcommerce
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: userEventsDB
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-net

  redis:
    image: redis:8.10.2
    container_name: redisEcommerce
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  # =========================================================
  # SEARCH / RECOMMENDATION
  # =========================================================

  elasticsearch:
    image: elasticsearch:9.2.5
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-net

  gorse:
    image: zhenghaoz/gorse-in-one:0.5.11
    container_name: gorse
    restart: unless-stopped
    environment:
      GORSE_CACHE_STORE: redis://redisEcommerce:6379
      GORSE_DATA_STORE: mysql://rookie:pwd@tcp(mysql:3306)/cybertechDB
    ports:
      - "8088:8088"
      - "8089:8089"
    volumes:
      # Positive / read feedback types (UserEventType names); without it Gorse counts no event as positive.
      - ./gorse/config.toml:/etc/gorse/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # =========================================================
  # AUTH / SECRETS / CLOUD MOCK
  # =========================================================

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.4
    container_name: keycloak
    restart: unless-stopped
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloakDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KC_DB_USERNAME: rookie
      KC_DB_PASSWORD: pwd
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_PROXY_HEADERS: xforwarded
    # --import-realm scans /opt/keycloak/data/import on every boot and seeds any realm found
    # there that doesn't already exist (IGNORE_EXISTING strategy) — safe to leave on permanently:
    # a no-op once the realm is already in the keycloakDB volume, auto-provisioning on a fresh one.
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      # Custom Cybertech login theme (overrides login/register/forgot/error pages
      # with the Material 3 design tokens used by the Next.js front-end).
      # Activate it from the admin UI: Realm settings -> Themes -> Login theme.
      - ./../keycloak/themes/cybertech:/opt/keycloak/themes/cybertech:ro
      # Realm/client/roles seed (cybertech realm, cybertech-user-management-client with its
      # service-account roles) — without this, a fresh Keycloak boots empty and every backend
      # call to the admin API fails until someone recreates the realm by hand.
      - ./../keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-net

  # =========================================================
  # SUPPORTING SERVICES
  # =========================================================

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    environment:
      MP_DATA_FILE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - ./mailpit-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - ecommerce-net

  moderation-api:
    build:
      context: ../../java/com/novatech/cybertech/api/external/moderation/
    container_name: moderation-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - ecommerce-net

  stripe:
    image: stripe/stripe-cli:v1.37.1
    container_name: stripe-cli
    restart: unless-stopped
    command: >
      listen
      --api-key sk_test_VePHdqKTYQjKNInc7u56JBrQ
      --forward-to http://host.docker.internal:8081/api/v1/webhooks/stripe
      --events payment_intent.succeeded,payment_intent.payment_failed,checkout.session.completed,charge.refunded
    environment:
      STRIPE_API_KEY: sk_test_VePHdqKTYQjKNInc7u56JBrQ
    networks:
      - ecommerce-net


  # =========================================================
  # RUSTFS (S3 COMPATIBLE OBJECT STORAGE) for testing / local development
  # =========================================================
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: rustfs
    restart: unless-stopped

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    command: [ "/data" ]

    ports:
      - "127.0.0.1:9000:9000" # API S3
      - "127.0.0.1:9001:9001" # Console web

    volumes:
      - rustfs_data:/data

    networks:
      - ecommerce-net

  s3-init:
    image: amazon/aws-cli:2.38.2
    container_name: rustfs-s3-init
    entrypoint: ["/bin/sh", "/init-s3.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://rustfs:9000
      BUCKET_NAME: cybertech-products
    volumes:
      - ./rustfs/init-s3.sh:/init-s3.sh:ro
    depends_on:
      - rustfs
    networks:
      - ecommerce-net

volumes:
  mysql_data:
    driver: local
  mongodb_data:
    driver: local
  esdata:
    driver: local
  rustfs_data:
    driver: local

networks:
  ecommerce-net:
    driver: bridge