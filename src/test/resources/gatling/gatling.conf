###################################
# Cybertech Gatling configuration #
###################################
#
# Overrides for the upstream gatling-core defaults. Values not listed here fall
# back to gatling.conf shipped inside the gatling-core JAR. Run with
#   ./mvnw gatling:test -Ploadtest
# Reports land in target/gatling/<simulation>-<timestamp>/.
#
gatling {
  core {
    encoding = "utf-8"
  }

  http {
    # Tuned for ~500 RPS sustained load with multiple plateaus.
    enableHostnameVerification = false
    fetchedCssCacheMaxCapacity = 200
    fetchedHtmlCacheMaxCapacity = 200
    perUserCacheMaxCapacity = 200

    ahc {
      # Connection pool sized for high concurrency. Increase if running
      # FlashSaleSimulation against a beefy staging — 1000 VUs need headroom.
      connectTimeout = 10000
      handshakeTimeout = 10000
      pooledConnectionIdleTimeout = 60000
      maxRetry = 0
      requestTimeout = 30000
      enableSni = true
    }
  }

  data {
    writers = [console, file]
    console {
      light = false
      writePeriod = 5
    }
  }
}
