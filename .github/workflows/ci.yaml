name: Cybertech CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Unit + Integration)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25-ea'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Maven Build
        # L'option -B (Batch mode) réduit les logs inutiles
        # 'verify' lance 'test' (unitaires) PUIS 'integration-test' et 'verify' (intégration)
        run: mvn -B clean verify

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports